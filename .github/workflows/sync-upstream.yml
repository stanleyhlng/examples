# Checks MEGA-DOT-DEV/examples for new commits every day. When there are
# any, it pushes them to the sync-upstream branch and opens a pull request
# into main. main is protected, so a sync always goes through a PR.
#
# Merge these PRs with "Create a merge commit", not squash. A squash drops
# the link to upstream's commits, and the next sync shows them again.
name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote add upstream https://github.com/MEGA-DOT-DEV/examples.git
          git fetch upstream main

          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" = 0 ]; then
            echo "main has every upstream commit."
            exit 0
          fi
          echo "Upstream has $behind new commit(s)."

          git push --force origin upstream/main:refs/heads/sync-upstream

          # --repo: in a fork, gh would otherwise pick the upstream repo.
          open=$(gh pr list --repo "$REPO" --head sync-upstream --state open --json number --jq length)
          if [ "$open" != 0 ]; then
            echo "The sync PR is already open. Its branch now has the new commits."
            exit 0
          fi

          gh pr create --repo "$REPO" --base main --head sync-upstream \
            --title "Sync with upstream MEGA-DOT-DEV/examples" \
            --body "Upstream has $behind new commit(s). Merge with **Create a merge commit**, not squash, so the next sync starts from here."
